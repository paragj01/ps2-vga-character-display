<text x="823.0" y="293" font-family="Consolas, Menlo, monospace" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">S_STOP</text>
<circle cx="26" cy="335" r="4" fill="#d97706"/>
<text x="38" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Sampled on each falling edge of PS2_CLK (after a 2-FF synchronizer on CLOCK_50).</text>
<text x="20" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Data bits: 0x1C → 0001 1100, sent LSB first. Three 1s in the data, so parity = 0 keeps the total odd.</text>
<text x="20" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">A bad parity or stop bit pulses frame_error; a good frame loads scan_code and pulses scan_ready for one cycle.</text>
