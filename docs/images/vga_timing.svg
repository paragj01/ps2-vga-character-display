<svg xmlns="http://www.w3.org/2000/svg" width="980" height="495" viewBox="0 0 980 495" role="img" aria-label="VGA horizontal and vertical timing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>VGA horizontal and vertical timing</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="980" height="495" fill="#ffffff"/>
<text x="500" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">VGA 640 × 480 timing as counted by vga_timing.v</text>
<text x="20" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Horizontal</text>
<text x="20" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">800 pixel clocks / line</text>
<rect x="210.0" y="90" width="88.8" height="34" fill="#d97706" fill-opacity="0.85" stroke="#fff"/>
<text x="254.4" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">Sync 96</text>
<rect x="298.8" y="90" width="44.4" height="34" fill="#9ca3af" fill-opacity="0.85" stroke="#fff"/>
<rect x="343.2" y="90" width="592.0" height="34" fill="#059669" fill-opacity="0.85" stroke="#fff"/>
<text x="639.2" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Active video  (640)</text>
<text x="639.2" y="142" font-family="Consolas, Menlo, monospace" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">144–783</text>
<rect x="935.2" y="90" width="14.8" height="34" fill="#9ca3af" fill-opacity="0.85" stroke="#fff"/>
<line x1="321.0" y1="90" x2="321.0" y2="67" stroke="#6b7280"/>
<text x="321.0" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Back porch 48  [96–143]</text>
<line x1="942.6" y1="90" x2="942.6" y2="83" stroke="#6b7280"/>
<text x="942.6" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">Front porch 16  [784–799]</text>
<text x="20" y="179" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="start" font-weight="bold">VGA_HS</text>
<polyline points="210,165 210,185 298.8,185 298.8,165 950,165" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="304.8" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">active low</text>
<text x="20" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold">Vertical</text>
<text x="20" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">525 lines / frame</text>
<rect x="210.0" y="265" width="2.8" height="34" fill="#d97706" fill-opacity="0.85" stroke="#fff"/>
<rect x="212.8" y="265" width="46.5" height="34" fill="#9ca3af" fill-opacity="0.85" stroke="#fff"/>
<rect x="259.3" y="265" width="676.6" height="34" fill="#059669" fill-opacity="0.85" stroke="#fff"/>
<text x="597.6190476190476" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Active video  (480)</text>
<text x="597.6190476190476" y="317" font-family="Consolas, Menlo, monospace" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">35–514</text>
<rect x="935.9" y="265" width="14.1" height="34" fill="#9ca3af" fill-opacity="0.85" stroke="#fff"/>
<line x1="211.4" y1="265" x2="211.4" y2="242" stroke="#6b7280"/>
<text x="211.40952380952382" y="239" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Sync 2  [0–1]</text>
<line x1="236.1" y1="265" x2="236.1" y2="258" stroke="#6b7280"/>
<text x="236.07619047619048" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="start" font-weight="normal">Back porch 33  [2–34]</text>
<line x1="943.0" y1="265" x2="943.0" y2="258" stroke="#6b7280"/>
<text x="942.952380952381" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="end" font-weight="normal">Front porch 10  [515–524]</text>
<text x="20" y="354" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="start" font-weight="bold">VGA_VS</text>
<polyline points="210,340 210,360 212.8,360 212.8,340 950,340" fill="none" stroke="#2563eb" stroke-width="2"/>
<text x="218.8190476190476" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">active low</text>
<rect x="20" y="405" width="930" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="36" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">Counter order in this design: sync → back porch → active → front porch, starting at h_cnt = 0 / v_cnt = 0.</text>
<text x="36" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">video_on = h_cnt in 144–783 and v_cnt in 35–514, and pixel_x / pixel_y are the counters minus those offsets.</text>
<text x="36" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">25 MHz ÷ (800 × 525) = 59.5 Hz frame rate, close enough to the 25.175 MHz standard for monitors to lock.</text>
</svg>
