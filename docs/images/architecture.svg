<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="560" viewBox="0 0 1430 560" role="img" aria-label="System architecture of the PS/2 to VGA character display" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>System architecture of the PS/2 to VGA character display</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="1430" height="560" fill="#ffffff"/>
