<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-label="Toggle synchronizer used for the 50 MHz to 25 MHz clock-domain crossing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Toggle synchronizer used for the 50 MHz to 25 MHz clock-domain crossing</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
</defs>
<rect width="1040" height="390" fill="#ffffff"/>
<text x="520" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold">Crossing from 50 MHz to 25 MHz: toggle synchronizer</text>
<rect x="20" y="50" width="400" height="250" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="6 4"/>
<text x="35" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="bold">CLOCK_50</text>
<rect x="450" y="50" width="570" height="250" rx="12" fill="#ecfdf5" stroke="#059669" stroke-dasharray="6 4"/>
<text x="465" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#059669" text-anchor="start" font-weight="bold">clk25</text>
<rect x="260" y="95" width="90" height="60" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/>
<path d="M260,137 l8,6 l-8,6" fill="none" stroke="#374151"/>
<text x="305.0" y="122" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">toggle_50</text>
<text x="305.0" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">flips on ready</text>
<polyline points="40,125 260,125" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="145" y="117" font-family="Consolas, Menlo, monospace" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">ascii_ready (1-cycle)</text>
<rect x="480" y="95" width="90" height="60" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/>
<path d="M480,137 l8,6 l-8,6" fill="none" stroke="#374151"/>
<text x="525.0" y="122" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ff1</text>
<rect x="610" y="95" width="90" height="60" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/>
<path d="M610,137 l8,6 l-8,6" fill="none" stroke="#374151"/>
<text x="655.0" y="122" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ff2</text>
<rect x="740" y="95" width="90" height="60" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/>
<path d="M740,137 l8,6 l-8,6" fill="none" stroke="#374151"/>
<text x="785.0" y="122" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ff3</text>
<polyline points="350,125 480,125" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="570,125 610,125" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="700,125 740,125" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M870,100 q20,25 0,50 q50,0 70,-25 q-20,-25 -70,-25 z" fill="#fff" stroke="#374151" stroke-width="1.6"/>
<path d="M862,100 q20,25 0,50" fill="none" stroke="#374151" stroke-width="1.6"/>
<text x="898" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">XOR</text>
<polyline points="720,125 720,175 850,175 850,140 876,140" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="830,125 850,125 850,110 876,110" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="940,125 1005,125" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1005" y="150" font-family="Consolas, Menlo, monospace" font-size="12" fill="#059669" text-anchor="end" font-weight="bold">ascii_ready_25</text>
<text x="1005" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal">one pulse per key</text>
<rect x="245" y="210" width="120" height="60" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/>
<path d="M245,252 l8,6 l-8,6" fill="none" stroke="#374151"/>
<text x="305.0" y="237" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ascii_code_50</text>
<text x="305.0" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">held stable</text>
<polyline points="40,240 245,240" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="140" y="232" font-family="Consolas, Menlo, monospace" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">ascii_code[6:0]</text>
<rect x="725" y="210" width="130" height="60" rx="6" fill="#fff" stroke="#374151" stroke-width="1.6"/>
<path d="M725,252 l8,6 l-8,6" fill="none" stroke="#374151"/>
<text x="790.0" y="237" font-family="Consolas, Menlo, monospace" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">ascii_code_25</text>
<text x="790.0" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">enable = ready_25</text>
<polyline points="365,240 725,240" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="595" y="232" font-family="Consolas, Menlo, monospace" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">settled long before ready_25 fires</text>
<polyline points="855,240 1005,240" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="930" y="232" font-family="Consolas, Menlo, monospace" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="normal">to text_display</text>
<text x="20" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">The 50 MHz side flips a flag instead of sending a 1-cycle pulse, so the slower clock cannot miss it.</text>
<text x="20" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">ff1/ff2 resynchronize the flag (metastability guard) and ff2 XOR ff3 turns each flip back into one clk25 pulse.</text>
<text x="20" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">The character code is captured with the flag, so it has settled by the time the clk25 side samples it.</text>
</svg>
